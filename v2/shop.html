<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בונים · סופלה</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#452910">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Suez+One&display=swap" rel="stylesheet">
<style>
:root{--pink:#EF4263;--pink-d:#d42f50;--pink-soft:#fde3e8;--choc:#452910;--cream:#FFF7F1;--cream-2:#FBEBDD;--ink:#2a1a0c;--muted:#8a6f5c;--line:#eedccd;--ok:#1f9d57;--blue:#1f6fd1;--warn-soft:#fff2d9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Heebo,system-ui,sans-serif;background:#f4ebe2;color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* כניסה */
#login{position:fixed;inset:0;z-index:50;background:var(--choc);display:grid;place-items:center;padding:16px}
#login .card{background:var(--cream);border-radius:28px;padding:32px 28px;width:min(360px,100%);text-align:center}
#login img{width:96px;margin:0 auto 10px}
#login h1{font-family:"Suez One";font-weight:400;color:var(--choc);font-size:28px}
#login p{color:var(--muted);font-size:14px;margin:4px 0 18px}
.pin{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.pin input{width:56px;height:64px;border-radius:16px;border:2px solid var(--line);text-align:center;font-size:30px;font-weight:800;background:#fff;color:var(--choc)}
.pin input:focus{outline:none;border-color:var(--pink)}
.err{color:var(--pink-d);font-weight:700;font-size:14px;min-height:18px}

/* פס עליון — מינימלי */
.bar{position:sticky;top:0;z-index:20;background:var(--choc);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px}
.bar img{width:40px;height:40px;background:#fff;border-radius:50%}
.bar .t{font-family:"Suez One";font-size:22px}
.bar .clock{margin-inline-start:auto;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.gear{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.12);font-size:22px}
.paused{display:none;background:var(--pink);color:#fff;text-align:center;font-weight:900;padding:10px;font-size:17px}
body.is-paused .paused{display:block}

/* הגדרות */
.menu{position:fixed;top:66px;left:14px;z-index:30;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);padding:10px;width:270px;display:none}
.menu.open{display:block}
.menu button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:15px;color:var(--choc);text-align:right}
.menu button:hover{background:var(--cream)}
.menu .sw{width:40px;height:23px;border-radius:12px;background:#d8cfc7;position:relative;flex:none}
.menu .sw::after{content:"";position:absolute;top:3px;right:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s}
.menu .on .sw{background:var(--ok)}
.menu .on .sw::after{transform:translateX(-17px)}
.menu .on.red .sw{background:var(--pink)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* רשימת הבונים */
main{max-width:760px;margin:0 auto;padding:18px 14px 60px}
.head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 4px 14px}
.head h1{font-size:22px;font-weight:900;color:var(--choc)}
.head span{font-size:15px;color:var(--muted);font-weight:700}
.wait{text-align:center;padding:70px 10px;color:var(--muted)}
.wait img{width:120px;margin:0 auto 14px;opacity:.85}
.wait b{display:block;font-size:22px;color:var(--choc);margin-bottom:4px}

.bon{background:#fff;border-radius:22px;margin-bottom:16px;box-shadow:0 8px 24px -12px rgba(69,41,16,.4);overflow:hidden;border:3px solid transparent}
.bon.fresh{border-color:var(--pink);animation:glow 1s ease-in-out 5}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(239,66,99,.22)}}
.bh{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--cream-2)}
.bh .no{font-family:"Suez One";font-size:40px;line-height:1;color:var(--choc)}
.tag{font-size:17px;font-weight:900;padding:6px 14px;border-radius:999px;color:#fff;background:var(--choc)}
.tag.delivery{background:var(--blue)}
.bh .ago{margin-inline-start:auto;font-size:15px;font-weight:800;color:var(--muted);text-align:left}
.bh .ago.late{color:var(--pink-d)}
.newflag{background:var(--pink);color:#fff;font-weight:900;font-size:13px;padding:3px 10px;border-radius:8px}
.bb{padding:14px 18px 6px}
.cust{font-size:18px;font-weight:900;color:var(--choc)}
.cust a{color:var(--choc);font-weight:700;text-decoration:none;margin-inline-start:8px;font-size:16px}
.addr{margin-top:8px;background:#eaf2ff;color:#14408c;font-weight:800;border-radius:12px;padding:8px 12px;font-size:16px}
.its{list-style:none;margin-top:12px;border-top:2px dashed var(--line)}
.its li{padding:10px 0;border-bottom:2px dashed var(--line)}
.its .r{font-size:19px;font-weight:900}
.its .r .q{color:var(--pink);margin-inline-end:6px}
.its .r small{font-size:15px;color:var(--muted);font-weight:700}
.its .op{font-size:15.5px;color:#5b3a1e;margin-top:3px;padding-inline-start:30px}
.its .nt{display:inline-block;margin-top:5px;margin-inline-start:30px;background:var(--warn-soft);color:#7a4a00;font-weight:900;border-radius:8px;padding:3px 9px;font-size:15px}
.onote{margin-top:10px;background:var(--warn-soft);color:#7a4a00;font-weight:900;border-radius:12px;padding:9px 12px;font-size:16px}
.ba{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:14px 18px 18px}
.ba button{padding:20px 10px;border-radius:16px;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px}
.b-print{background:var(--cream);border:2.5px solid var(--choc)!important;color:var(--choc)}
.b-print.done{border-color:var(--line)!important;color:var(--muted)}
.b-ready{background:var(--ok);color:#fff}
.b-ready.delivery{background:var(--blue)}

.donebox{margin-top:26px}
.donebox summary{cursor:pointer;font-weight:900;color:var(--choc);font-size:16px;padding:8px 4px}
.drow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px 16px;margin:8px 0;font-size:15px}
.drow .no{font-family:"Suez One";font-size:22px;color:var(--choc)}
.drow button{font-size:13px;color:var(--muted);text-decoration:underline;margin-inline-start:auto}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--choc);color:#fff;padding:14px 20px;border-radius:16px;font-weight:900;font-size:17px;opacity:0;transition:all .3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ===== בון להדפסה — מדפסת תרמית 80 מ"מ ===== */
#printBon{display:none}
@media print{
  @page{size:80mm auto;margin:0}
  body{background:#fff}
  body>*:not(#printBon){display:none!important}
  #printBon{display:block;width:72mm;margin:0 auto;padding:3mm 0 6mm;font-family:Arial,Heebo,sans-serif;color:#000;font-size:12.5pt;line-height:1.35;direction:rtl}
  #printBon .c{text-align:center}
  #printBon .shop{font-size:18pt;font-weight:900}
  #printBon .sm{font-size:10pt}
  #printBon .no{font-size:34pt;font-weight:900;line-height:1;margin:2mm 0}
  #printBon .mode{display:inline-block;border:2px solid #000;padding:1mm 4mm;font-weight:900;font-size:14pt}
  #printBon hr{border:0;border-top:1.5px dashed #000;margin:2.5mm 0}
  #printBon .kv{display:flex;justify-content:space-between;gap:3mm}
  #printBon .big{font-size:14pt;font-weight:900}
  #printBon .addr{border:2px solid #000;padding:1.5mm 2mm;font-weight:900;font-size:13.5pt;margin-top:1.5mm;background:none;color:#000;border-radius:0}
  #printBon ul{list-style:none;padding:0}
  #printBon li{margin-bottom:2.2mm}
  #printBon .it{display:flex;gap:2mm;font-weight:900;font-size:13.5pt}
  #printBon .it .q{min-width:8mm}
  #printBon .op{padding-right:10mm;font-size:11.5pt}
  #printBon .nt{padding-right:10mm;font-weight:900;font-size:11.5pt}
  #printBon .note{border:2px solid #000;padding:1.5mm 2mm;font-weight:900}
  #printBon .total{font-size:16pt;font-weight:900}
}
</style>
</head>
<body>

<div id="login">
  <div class="card">
    <img src="brand/logo-clean.png" alt="">
    <h1>בונים · סופלה</h1>
    <p>הקלד את קוד העובד</p>
    <div class="pin" dir="ltr">
      <input inputmode="numeric" maxlength="1" aria-label="ספרה 1"><input inputmode="numeric" maxlength="1" aria-label="ספרה 2"><input inputmode="numeric" maxlength="1" aria-label="ספרה 3"><input inputmode="numeric" maxlength="1" aria-label="ספרה 4">
    </div>
    <div class="err" id="pinErr"></div>
    <p style="font-size:12px;margin-top:10px">במוקאפ: קוד 1234</p>
  </div>
</div>

<header class="bar">
  <img src="brand/logo-clean.png" alt="">
  <span class="t">בונים</span>
  <span class="clock" id="clock">--:--</span>
  <button class="gear" id="gear" aria-label="הגדרות" aria-expanded="false">⚙</button>
</header>
<div class="paused">⏸ האתר לא מקבל הזמנות כרגע</div>

<div class="menu" id="menu" role="menu">
  <button data-k="sound" role="menuitemcheckbox">צליל בהזמנה חדשה<span class="sw"></span></button>
  <button data-k="autoprint" role="menuitemcheckbox">הדפסה אוטומטית<span class="sw"></span></button>
  <button data-k="paused" class="red" role="menuitemcheckbox">עצירת הזמנות מהאתר<span class="sw"></span></button>
  <hr>
  <button onclick="demoOrder()">+ בון לדוגמה</button>
  <button onclick="logout()">יציאה</button>
</div>

<main>
  <div class="head"><h1 id="hTitle">בונים פתוחים</h1><span id="hSum"></span></div>
  <div id="list"></div>
  <details class="donebox"><summary>מוכנים היום (<span id="cDone">0</span>)</summary><div id="done"></div></details>
</main>

<div id="printBon"></div>
<div class="toast" id="toast"></div>

<script>
/* ===== נתונים =====
   במוקאפ: localStorage (האתר והמסך באותו דפדפן).
   בגרסה האמיתית: Supabase Realtime — רק הזמנות שהסליקה אישרה. */
const STORE_KEY="sfl_orders_v2",PIN="1234",SLA={pickup:40,delivery:90};
const Orders={
  all(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||[]}catch{return []}},
  save(l){try{localStorage.setItem(STORE_KEY,JSON.stringify(l))}catch{}},
  update(id,p){const l=this.all(),o=l.find(x=>x.id===id);if(o){Object.assign(o,p);this.save(l)}return o},
  onChange(cb){addEventListener("storage",e=>{if(e.key===STORE_KEY)cb()})}
};
const pref={get(k,d){try{const v=localStorage.getItem("sfl_shop_"+k);return v===null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem("sfl_shop_"+k,JSON.stringify(v))}catch{}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const hhmm=t=>new Date(t).toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"});
const day=t=>new Date(t).toLocaleDateString("en-CA",{timeZone:"Asia/Jerusalem"});
const isToday=t=>day(t)===day(Date.now());
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),2500)}

/* ===== כניסה ===== */
(function(){
  const ins=[...document.querySelectorAll(".pin input")];
  if(sessionStorage.getItem("sfl_shop_ok")==="1"){$("#login").remove();return}
  ins[0].focus();
  ins.forEach((inp,k)=>{
    inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"");if(inp.value&&k<3)ins[k+1].focus();
      const code=ins.map(i=>i.value).join("");
      if(code.length===4){if(code===PIN){sessionStorage.setItem("sfl_shop_ok","1");$("#login").remove();unlockAudio()}else{$("#pinErr").textContent="קוד שגוי";ins.forEach(i=>i.value="");ins[0].focus()}}});
    inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!inp.value&&k)ins[k-1].focus()});
  });
})();
function logout(){sessionStorage.removeItem("sfl_shop_ok");location.reload()}

/* ===== צליל ===== */
let ac=null;
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch{}}
addEventListener("pointerdown",unlockAudio,{once:true});
function ding(){
  if(!pref.get("sound",true)||!ac)return;
  [0,.18,.36].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=[880,1175,1568][i];
    g.gain.setValueAtTime(.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.45,ac.currentTime+d+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d+.35);
    o.connect(g).connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.4)});
}

/* ===== הגדרות ===== */
const DEF={sound:true,autoprint:true,paused:false};
function applyPrefs(){
  document.querySelectorAll(".menu [data-k]").forEach(b=>{const v=pref.get(b.dataset.k,DEF[b.dataset.k]);b.classList.toggle("on",v);b.setAttribute("aria-checked",v)});
  const p=pref.get("paused",false);document.body.classList.toggle("is-paused",p);try{localStorage.setItem("sfl_accepting",p?"0":"1")}catch{}
}
$("#menu").addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;pref.set(b.dataset.k,!pref.get(b.dataset.k,DEF[b.dataset.k]));applyPrefs()});
$("#gear").onclick=()=>{const m=$("#menu"),o=!m.classList.contains("open");m.classList.toggle("open",o);$("#gear").setAttribute("aria-expanded",o)};
document.addEventListener("click",e=>{if(!e.target.closest("#menu,#gear"))$("#menu").classList.remove("open")});
applyPrefs();

/* ===== רשימה ===== */
function ago(o){const m=Math.floor((Date.now()-o.created_at)/60000);return {m,late:m>(SLA[o.mode]||40)}}
function bonCard(o){
  const del=o.mode==="delivery",a=ago(o);
  return `<article class="bon${o._fresh?" fresh":""}" data-id="${o.id}">
    <div class="bh"><span class="no">#${o.no}</span><span class="tag ${o.mode}">${del?"🛵 משלוח":"🏃 איסוף"}</span>${o._fresh?'<span class="newflag">חדש!</span>':""}
      <span class="ago ${a.late?"late":""}">${hhmm(o.created_at)}<br>לפני ${a.m} דק׳</span></div>
    <div class="bb">
      <div class="cust">${esc(o.name)}<a href="tel:${esc(o.phone)}">📞 ${esc(o.phone)}</a></div>
      ${del&&o.address?`<div class="addr">📍 ${esc(o.address.street)}, ${esc(o.address.city)}${o.address.apt?" · "+esc(o.address.apt):""}</div>`:""}
      <ul class="its">${o.items.map(it=>`<li><div class="r"><span class="q">${it.qty}×</span>${esc(it.name)}${it.size?` <small>(${esc(it.size)})</small>`:""}</div>
        ${(it.opts||[]).map(op=>`<div class="op">${esc(op.t)}: ${op.v.map(esc).join(", ")}</div>`).join("")}
        ${it.note?`<div class="nt">✎ ${esc(it.note)}</div>`:""}</li>`).join("")}</ul>
      ${o.note?`<div class="onote">📝 ${esc(o.note)}</div>`:""}
    </div>
    <div class="ba">
      <button class="b-print ${o.printed?"done":""}" onclick="printBon('${o.id}')">🖨 ${o.printed?"הדפס שוב":"הדפס"}</button>
      <button class="b-ready ${o.mode}" onclick="ready('${o.id}')">${del?"✓ מוכן — יצא למשלוח":"✓ מוכן לאיסוף"}</button>
    </div>
  </article>`;
}
const firstRun=pref.get("known",null)===null;
let known=new Set(pref.get("known",[]));
function render(){
  const today=Orders.all().filter(o=>isToday(o.created_at));
  const open=today.filter(o=>o.status!=="done").sort((a,b)=>a.created_at-b.created_at);
  const done=today.filter(o=>o.status==="done").sort((a,b)=>(b.done_at||0)-(a.done_at||0));
  const fresh=open.filter(o=>!known.has(o.id));
  fresh.forEach(o=>known.add(o.id));pref.set("known",[...known].slice(-300));
  const freshIds=new Set(fresh.map(o=>o.id));
  $("#hTitle").textContent=open.length?`בונים פתוחים (${open.length})`:"בונים פתוחים";
  $("#hSum").textContent=`היום: ${today.length} הזמנות · ₪${today.reduce((s,o)=>s+(o.paid?o.total:0),0)}`;
  $("#list").innerHTML=open.length?open.map(o=>bonCard({...o,_fresh:freshIds.has(o.id)})).join("")
    :`<div class="wait"><img src="brand/logo-clean.png" alt=""><b>אין בונים פתוחים</b>בון חדש יקפוץ כאן עם צליל</div>`;
  $("#cDone").textContent=done.length;
  $("#done").innerHTML=done.map(o=>`<div class="drow"><span class="no">#${o.no}</span><b>${esc(o.name)}</b><span>${o.mode==="delivery"?"משלוח":"איסוף"} · ${hhmm(o.created_at)}</span><button onclick="printBon('${o.id}')">הדפס</button><button style="margin-inline-start:0" onclick="undo('${o.id}')">החזר</button></div>`).join("");
  if(fresh.length&&(render.ready||!firstRun)){
    ding();toast(`בון חדש #${fresh.at(-1).no}`);
    if(pref.get("autoprint",true))fresh.forEach((o,k)=>setTimeout(()=>printBon(o.id),500+k*1500));
    document.title=`(${fresh.length}) בון חדש · סופלה`;setTimeout(()=>document.title="בונים · סופלה",8000);
  }
  render.ready=true;
}
function ready(id){
  const o=Orders.update(id,{status:"done",done_at:Date.now()});
  // באמת: כאן נשלח SMS ללקוח ("ההזמנה מוכנה לאיסוף" / "ההזמנה יצאה אליך")
  toast(o.mode==="delivery"?`#${o.no} יצא למשלוח ✓`:`#${o.no} מוכן — הלקוח מקבל הודעה ✓`);
  render();
}
function undo(id){Orders.update(id,{status:"new"});render()}

/* ===== הדפסת בון ===== */
function printBon(id){
  const o=Orders.all().find(x=>x.id===id);if(!o)return;
  $("#printBon").innerHTML=`
    <div class="c shop">סופלה</div><div class="c sm">Sweet treat · 052-6612332</div><hr>
    <div class="c no">#${o.no}</div>
    <div class="c"><span class="mode">${o.mode==="delivery"?"משלוח":"איסוף עצמי"}</span></div>
    <div class="c sm" style="margin-top:1.5mm">${new Date(o.created_at).toLocaleString("he-IL",{timeZone:"Asia/Jerusalem",day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})}</div><hr>
    <div class="big">${esc(o.name)}</div>
    <div class="big" dir="ltr" style="text-align:right">${esc(o.phone)}</div>
    ${o.mode==="delivery"&&o.address?`<div class="addr">${esc(o.address.street)}, ${esc(o.address.city)}${o.address.apt?"<br>"+esc(o.address.apt):""}</div>`:""}
    <hr><ul>${o.items.map(it=>`<li><div class="it"><span class="q">${it.qty}×</span><span>${esc(it.name)}${it.size?" ("+esc(it.size)+")":""}</span></div>
      ${(it.opts||[]).map(op=>`<div class="op">${esc(op.t)}: ${op.v.map(esc).join(", ")}</div>`).join("")}
      ${it.note?`<div class="nt">** ${esc(it.note)} **</div>`:""}</li>`).join("")}</ul>
    ${o.note?`<hr><div class="note">הערה: ${esc(o.note)}</div>`:""}
    <hr>${o.delivery_fee?`<div class="kv"><span>משלוח</span><span>₪${o.delivery_fee}</span></div>`:""}
    <div class="kv total"><span>סה״כ</span><span>₪${o.total}</span></div>
    <div class="kv"><span>${o.paid?"שולם":"לא שולם"}</span><span>${esc(o.pay_method||"")}</span></div>
    <hr><div class="c sm">תודה! מגיע לך להתפנק</div>`;
  Orders.update(id,{printed:true});
  window.print();
  render();
}

/* ===== בון לדוגמה ===== */
function demoOrder(){
  $("#menu").classList.remove("open");
  const l=Orders.all(),no=l.reduce((m,o)=>Math.max(m,o.no||1000),1000)+1,del=l.length%2===0;
  const o={id:"o"+Date.now(),no,created_at:Date.now(),status:"new",paid:true,pay_method:del?"Bit":"אשראי",
    mode:del?"delivery":"pickup",name:del?"דוד לוי":"יוסי כהן",phone:del?"052-7654321":"050-1234567",
    address:del?{street:"הרב יהודה צדקה 14",city:"ביתר עילית",apt:"קומה 2, דירה 7"}:null,
    items:[{name:"וופל בלגי",qty:1,unit:43,opts:[{t:"רטבים",v:["נוטלה","פיסטוק"]},{t:"תוספות",v:["קינדר בואנו","לוטוס","אוראו"]},{t:"כדור גלידה / קצפת",v:["כדור גלידה"]}],note:"רוטב בצד"},
           {name:"שייק פירות",size:"L",qty:1,unit:32,opts:[{t:"בסיס",v:["חלב"]},{t:"פירות",v:["תות","בננה","מנגו"]}]},
           {name:"קפה הפוך",size:"גדול",qty:2,unit:15,opts:[]}],
    note:del?"להתקשר כשמגיעים, האינטרקום לא עובד":"",delivery_fee:del?25:0};
  o.total=o.items.reduce((a,i)=>a+i.unit*i.qty,0)+o.delivery_fee;
  l.push(o);Orders.save(l);render();
}

/* ===== שעון ===== */
function tick(){$("#clock").textContent=new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"})}
Orders.onChange(render);
tick();render();setInterval(tick,15000);setInterval(render,60000);
</script>
